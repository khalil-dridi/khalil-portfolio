# ==========================================
# APPLICATION CONFIGURATION
# ==========================================

spring:
  application:
    name: portfolio-backend
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:110MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:115MB}

  profiles:
    default: dev


# ==========================================
# SERVER CONFIGURATION
# ==========================================

server:
  port: ${SERVER_PORT:8080}


# ==========================================
# ACTUATOR CONFIGURATION
# ==========================================

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never


# ==========================================
# SECURITY CONFIGURATION
# ==========================================

app:
  profile:
    image-storage-dir: ${PROFILE_IMAGE_STORAGE_DIR:./var/profile-images}
  project:
    storage:
      image-dir: ${PROJECT_IMAGE_STORAGE_DIR:./var/project-media/images}
      video-dir: ${PROJECT_VIDEO_STORAGE_DIR:./var/project-media/videos}
    media:
      image-max-size: ${PROJECT_IMAGE_MAX_SIZE:5242880}
      video-max-size: ${PROJECT_VIDEO_MAX_SIZE:104857600}
  security:
    refresh-token-expiration: 7d
    access-token-expiration: 15m
    jwt:
      # Use a random value of at least 32 bytes; prefix Base64 values with "base64:".
      secret: ${JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
