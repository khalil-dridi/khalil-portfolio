# ==========================================
# APPLICATION CONFIGURATION
# ==========================================

spring:
  application:
    name: portfolio-backend
  servlet:
    multipart:
      max-file-size: ${PROFILE_IMAGE_MAX_SIZE:5MB}
      max-request-size: ${PROFILE_IMAGE_MAX_SIZE:5MB}

  profiles:
    default: dev


# ==========================================
# SERVER CONFIGURATION
# ==========================================

server:
  port: ${SERVER_PORT:8080}


# ==========================================
# ACTUATOR CONFIGURATION
# ==========================================

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never


# ==========================================
# SECURITY CONFIGURATION
# ==========================================

app:
  profile:
    image-storage-dir: ${PROFILE_IMAGE_STORAGE_DIR:./var/profile-images}
  security:
    refresh-token-expiration: 7d
    access-token-expiration: 15m
    jwt:
      # Use a random value of at least 32 bytes; prefix Base64 values with "base64:".
      secret: ${JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
