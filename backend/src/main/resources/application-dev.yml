spring:
  # ==============================
  # DATABASE CONFIGURATION
  # ==============================
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/khalil_portfolio}
    username: ${DB_USERNAME:portfolio_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==============================
  # JPA / HIBERNATE
  # ==============================
  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false

    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # ==============================
  # FLYWAY MIGRATIONS
  # ==============================
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    cookie-secure: false

    jwt:
      secret: ${JWT_SECRET:}

  cors:
    allowed-origins: http://localhost:4200

# ==============================
# LOGGING
# ==============================
logging:
  level:
    root: INFO
    com.khalildridi: DEBUG