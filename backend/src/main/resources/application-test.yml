spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/khalil_portfolio_test}
    username: ${TEST_DB_USERNAME:portfolio_test}
    password: ${TEST_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  profile:
    image-storage-dir: ${java.io.tmpdir}/portfolio-profile-images
  security:
    jwt:
      secret: ${JWT_SECRET:}
    cookie-secure: false
  cors:
    allowed-origins: http://localhost:4200

logging:
  level:
    root: WARN
    com.khalildridi: INFO
