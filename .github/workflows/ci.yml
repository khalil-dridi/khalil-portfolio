name: Khalil Portfolio CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up npm
        run: npm install --global --ignore-scripts npm@11.16.0
        
      - name: Install frontend dependencies
        run: npm ci --strict-allow-scripts
        working-directory: frontend

      - name: Run frontend tests with coverage
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage
        working-directory: frontend

      - name: Prepare SonarCloud LCOV paths
        run: node scripts/normalize-sonar-lcov.mjs
        working-directory: frontend

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lcov
          path: frontend/coverage/portfolio-frontend/lcov-sonar.info
          if-no-files-found: error
          retention-days: 1

      - name: Build frontend
        run: npm run build
        working-directory: frontend
  backend:
    name: Backend CI
    needs: frontend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test backend
        run: mvn -B clean verify
        working-directory: backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-lcov
          path: frontend/coverage/portfolio-frontend

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Authenticate with SonarQube
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        id: auth

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4
        with:
          args: >
            -Dsonar.organization=${{ steps.auth.outputs.organization }}
            -Dsonar.projectKey=${{ steps.auth.outputs.project-key }}