<div class="theme-controls" aria-label="Préférences d'apparence">
  <button
    class="round-control"
    type="button"
    (click)="theme.toggleMode()"
    [attr.aria-label]="theme.mode() === 'light' ? 'Activer le mode sombre' : 'Activer le mode clair'"
    [title]="theme.mode() === 'light' ? 'Mode sombre' : 'Mode clair'"
  >
    @if (theme.mode() === 'light') {
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg>
    }
  </button>

  <fieldset class="accent-picker">
    <legend>Thème couleur</legend>
    <div class="swatches">
      @for (accent of accents; track accent.id) {
        <button
          type="button"
          class="swatch"
          [class.selected]="theme.accent() === accent.id"
          [attr.data-swatch]="accent.id"
          [attr.aria-label]="'Couleur ' + accent.label"
          [attr.title]="accent.label"
          [attr.aria-pressed]="theme.accent() === accent.id"
          (click)="theme.setAccent(accent.id)"
        >
          @if (theme.accent() === accent.id) {
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
          }
        </button>
      }
    </div>
  </fieldset>
</div>
