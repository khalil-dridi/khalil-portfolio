<div class="app-layout app-layout--public" [class.drawer-open]="menuOpen">
  @if (menuOpen) {
    <button class="drawer-backdrop" type="button" aria-label="Fermer le menu" (click)="closeMenu()"></button>
  }

  <aside class="app-sidebar" aria-label="Navigation principale">
    <a class="app-brand" routerLink="/" (click)="closeMenu()" aria-label="Khalil Portfolio, accueil">
      <span class="app-brand-mark" aria-hidden="true">K</span>
      <span class="app-brand-name">Khalil<span>Portfolio</span></span>
    </a>

    <p class="sidebar-section-label">Navigation</p>
    <nav class="app-nav" id="public-navigation">
      <a class="app-nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span>
      </a>
      <a class="app-nav-link" routerLink="/about" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg><span>About</span>
      </a>
      <a class="app-nav-link" routerLink="/skills" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span>Skills</span>
      </a>
      <a class="app-nav-link" routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5m8-5v5"/></svg><span>Portfolio</span>
      </a>
      <a class="app-nav-link" routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg><span>Contact</span>
      </a>
    </nav>

    <div class="app-sidebar-footer">
      <span class="status-dot" aria-hidden="true"></span>
      <span>Portfolio personnel</span>
      <small>© {{ year }} Khalil Dridi</small>
    </div>
  </aside>

  <div class="app-main-column">
    <header class="app-header">
      <button class="menu-toggle" type="button" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-controls="public-navigation" [attr.aria-label]="menuOpen ? 'Fermer la navigation' : 'Ouvrir la navigation'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <p class="header-context">Khalil Dridi <span>/</span> Portfolio</p>
      <app-theme-controls />
    </header>

    <main class="app-page-content" id="main-content">
      <router-outlet />
    </main>
  </div>
</div>
