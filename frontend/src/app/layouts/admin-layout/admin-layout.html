<div class="app-layout app-layout--admin" [class.drawer-open]="menuOpen">
  @if (menuOpen) {
    <button class="drawer-backdrop" type="button" aria-label="Fermer le menu" (click)="closeMenu()"></button>
  }

  <aside class="app-sidebar" aria-label="Navigation d'administration">
    <a class="app-brand" routerLink="/admin/career" (click)="closeMenu()" aria-label="Khalil Portfolio, Career">
      <span class="app-brand-mark" aria-hidden="true">K</span>
      <span class="app-brand-name">Khalil<span>Portfolio</span></span>
    </a>

    <div class="admin-badge"><span aria-hidden="true"></span>Espace Admin</div>
    <p class="sidebar-section-label">Gestion</p>
    <nav class="app-nav" id="admin-navigation">
      <a class="app-nav-link" routerLink="/admin/profile" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span>
      </a>
      <a class="app-nav-link" routerLink="/admin/projects" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5m8-5v5"/></svg><span>Projects</span>
      </a>
      <a class="app-nav-link" routerLink="/admin/career" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5m0 14h16M8 15l3-4 3 2 5-7"/></svg><span>Career</span>
      </a>
    </nav>

    <div class="app-sidebar-actions">
      <a class="app-nav-link secondary-link" routerLink="/" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Back to website</span>
      </a>
      <button class="app-nav-link logout-link" type="button" (click)="logout()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3m9-9h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>Log out</span>
      </button>
    </div>

    <div class="app-sidebar-footer"><small>© {{ year }} Khalil Dridi</small></div>
  </aside>

  <div class="app-main-column">
    <header class="app-header">
      <button class="menu-toggle" type="button" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-controls="admin-navigation" [attr.aria-label]="menuOpen ? 'Fermer la navigation' : 'Ouvrir la navigation'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="page-heading"><p class="header-context">Administration <span>/</span> {{ pageTitle }}</p><h1>{{ pageTitle }}</h1></div>
      <div class="header-actions">
        @if (auth.admin(); as admin) { <span class="admin-email">{{ admin.email }}</span> }
        <app-theme-controls />
      </div>
    </header>

    <main class="app-page-content" id="main-content">
      <router-outlet />
    </main>
  </div>
</div>
